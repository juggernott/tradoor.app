services:
  research:
    build:
      context: ..
      dockerfile: deploy/runner.Dockerfile
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: "no"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    volumes:
      - type: bind
        source: ${TRADOOR_RUNNER_INPUT:?Set private input directory}
        target: /input
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TRADOOR_RUNNER_SOURCE:?Set private source directory}
        target: /strategy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TRADOOR_RUNNER_OUTPUT:?Set dedicated empty output directory}
        target: /output
        bind:
          create_host_path: false
    command:
      - --csv
      - /input/prices.csv
      - --config
      - /input/config.json
      - --output
      - /output/report.json
      - --source-root
      - /strategy
      - --factory
      - ${TRADOOR_RUNNER_FACTORY:?Set customer adapter factory}
