name: xrp-volume-noise-scalp
hypothesis: >-
  DESIGNED TO FAIL (for demoing the validation gate). Claims XRP volume
  ticking above its own 3-period rolling mean predicts a short-term
  move worth trading, at high frequency and realistic-to-punitive
  costs. This is a noise signal with no real edge, and the costs alone
  should sink it even if the signal weren't noise — the validation
  gate should KILL this every time.
kind: timeseries
universe:
  symbols:
    - XRP/USDT
features:
  - price.ohlcv:1h
signals:
  entry: volume > volume.rolling(3).mean()
  exit: volume < volume.rolling(3).mean()
sizer:
  name: fixed_fractional
  params:
    fraction: 0.5
risk:
  max_position_pct: 0.5
  max_gross_exposure: 1.0
  max_net_exposure: 1.0
  per_trade_risk_pct: 0.05
  drawdown_halt_pct: 0.5
costs:
  fee_bps: 50
  slippage_bps: 50
  funding: true
data_window:
  start: "2024-01-01"
  end: "2024-04-01"
  freq: 1h
venue: binance
tags:
  - example
  - designed-to-fail
