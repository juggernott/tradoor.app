name: majors-24h-momentum-rank
hypothesis: >-
  Across a small universe of major-cap coins, the assets with the
  strongest 24-period return keep outperforming the weakest over the
  following rebalance period (cross-sectional momentum / winner
  continuation).
kind: crosssectional
universe:
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - XRP/USDT
    - ADA/USDT
features:
  - price.ohlcv:1h
signals:
  score: close.pct_change(24)
  rebalance: D
  top_n: 2
  bottom_n: 1
sizer:
  name: rank_weights
  params:
    score_weighted: false
risk:
  max_position_pct: 0.4
  max_gross_exposure: 1.0
  max_net_exposure: 0.5
  per_trade_risk_pct: 0.02
  drawdown_halt_pct: 0.25
costs:
  fee_bps: 7.5
  slippage_bps: 5.0
  funding: true
data_window:
  start: "2024-01-01"
  end: "2024-04-01"
  freq: 1h
venue: binance
tags:
  - crosssectional
  - momentum
