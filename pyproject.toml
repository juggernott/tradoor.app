[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaloop"
version = "0.1.0"
description = "An open-source agentic research loop for crypto quants — where most alpha goes to die."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Alphaloop contributors" }]
keywords = ["quant", "trading", "backtesting", "crypto", "research"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "ccxt>=4.3",
    "pyarrow>=15.0",
    "requests>=2.31",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# vectorbt (the open-source backtest engine) pins plotly's *rendering* template
# in a way that breaks on plotly>=5.19 (it references the removed
# `scattermapbox` trace type). Pin plotly to keep it importable until upstream
# fixes it: https://github.com/polakowo/vectorbt/issues (template init).
vectorbt = ["vectorbt>=0.26", "plotly==5.18.0"]
binance = ["ccxt>=4.3"]
hyperliquid = ["hyperliquid-python-sdk>=0.8"]
llm = ["anthropic>=0.34", "openai>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs",
]
all = ["alphaloop[vectorbt,binance,hyperliquid,llm,dev]"]

[project.scripts]
alphaloop = "alphaloop.cli:app"

# Entry-point groups that external packages (e.g. a private strategy repo)
# use to register their own adapters/engines/sizers/executors/validators
# without touching this repository. See docs/private-repo-guide.md.
[project.entry-points."alphaloop.adapters"]
ccxt = "alphaloop.adapters.ccxt_data:CcxtDataAdapter"
elfa = "alphaloop.adapters.elfa:ElfaAdapter"
nansen = "alphaloop.adapters.nansen:NansenAdapter"
cryptoquant = "alphaloop.adapters.cryptoquant:CryptoQuantAdapter"
glassnode = "alphaloop.adapters.glassnode:GlassnodeAdapter"

[project.entry-points."alphaloop.events"]
grok_news = "alphaloop.events.grok_news:GrokNewsEventAdapter"

[project.entry-points."alphaloop.engines"]
vectorbt = "alphaloop.backtest.vectorbt_engine:VectorbtEngine"

[project.entry-points."alphaloop.sizers"]
fixed_fractional = "alphaloop.sizing.fixed_fractional:FixedFractionalSizer"
vol_target = "alphaloop.sizing.vol_target:VolTargetSizer"
kelly = "alphaloop.sizing.kelly:KellyCappedSizer"
atr = "alphaloop.sizing.atr:AtrRiskSizer"
signal_scaled = "alphaloop.sizing.signal_scaled:SignalScaledSizer"
rank_weights = "alphaloop.sizing.rank_weights:RankWeightsSizer"

[project.entry-points."alphaloop.executors"]
paper = "alphaloop.execute.paper:PaperExecutor"
binance = "alphaloop.execute.binance_ccxt:BinanceExecutor"
hyperliquid = "alphaloop.execute.hyperliquid:HyperliquidExecutor"

[project.entry-points."alphaloop.validators"]
required_checks = "alphaloop.validate.grades:RequiredChecksValidator"

[tool.hatch.build.targets.wheel]
packages = ["alphaloop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests", "examples"]

[[tool.mypy.overrides]]
module = ["vectorbt.*", "ccxt.*", "hyperliquid.*", "anthropic.*", "openai.*", "scipy.*", "eth_account.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
